server.port=8888
spring.application.name=config-server

# Disable Eureka client for config-server (it should be standalone)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Use Git repository for configuration
spring.cloud.config.server.git.uri=https://github.com/sintayehu-dev/gyt_config_server.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true

# Enable actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
