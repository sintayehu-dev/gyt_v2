  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    depends_on:
      ticket-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker,rabbitmq-common
    networks:
