      test: [ "CMD-SHELL", "curl -f http://localhost:9192/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  movie-service:
    build: ./movie-service
    container_name: movie-service
    depends_on:
      movie-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker,rabbitmq-common
      CLOUDINARY_CLOUD_NAME: dv9473ke9
      CLOUDINARY_API_KEY: 831237963945825
      CLOUDINARY_API_SECRET: Qoz0deZDlsoGrQ6JrAjYZrWeyho
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9194/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  schedule-service:
    build: ./schedule-service
    container_name: schedule-service
    depends_on:
      schedule-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker,rabbitmq-common
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9195/actuator/health || exit 1" ]
      interval: 15s
