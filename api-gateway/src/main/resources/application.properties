server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong

management.endpoints.web.exposure.include=*

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[2].id=movie-admin-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://MOVIE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/admin/movies/**

spring.cloud.gateway.server.webflux.routes[3].id=movie-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://MOVIE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/movies/**

spring.cloud.gateway.server.webflux.routes[4].id=schedule-admin-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://SCHEDULE-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/admin/schedules/**

spring.cloud.gateway.server.webflux.routes[5].id=schedule-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://SCHEDULE-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/schedules/**

spring.cloud.gateway.server.webflux.routes[6].id=ticket-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://TICKET-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/tickets/**

spring.cloud.gateway.server.webflux.routes[7].id=ticket-admin-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://TICKET-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/admin/tickets/**

spring.config.import=optional:configserver:http://config-server:8888/

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
